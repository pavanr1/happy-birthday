<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #1a1a2e;
        }

        .page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }

        /* Page 1 - Image with tap to continue */
        #page1 {
            background-image: url('images/image1.png');
            background-size: cover;
            background-position: center;
            cursor: pointer;
        }

        #page1::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.2);
        }

        .page1-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
        }

        .birthday-title {
            font-size: 5rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: fadeInScale 1.2s ease;
        }

        .birthday-emoji {
            font-size: 6rem;
            display: block;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        .tap-hint {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.3rem;
            text-align: center;
            z-index: 10;
            animation: pulse 2s ease-in-out infinite;
            background: rgba(0, 0, 0, 0.6);
            padding: 18px 35px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .tap-hint::before {
            content: '👆';
            display: block;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        /* Page 2 - Message with image2 background */
        #page2 {
            background-image: url('images/image2.png');
            background-size: cover;
            background-position: center;
            overflow-y: auto;
        }

        #page2::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        .message-section {
            position: relative;
            z-index: 3;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-container {
            width: 90%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }

        .message-container h1 {
            text-align: center;
            color: #667eea;
            font-size: 3rem;
            margin-bottom: 30px;
            animation: fadeIn 1s ease;
        }

        .message-content {
            text-align: center;
        }

        .message-line {
            font-size: 1.6rem;
            line-height: 2.2;
            color: #333;
            margin: 15px 0;
            animation: slideUp 0.8s ease forwards;
            opacity: 0;
        }

        .message-line.highlight {
            color: #667eea;
            font-weight: bold;
            font-size: 1.8rem;
        }


        @keyframes pulse {
            0%, 100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translateX(-50%) scale(1.05);
                opacity: 0.8;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ffd700;
            z-index: 100;
            pointer-events: none;
        }

        .confetti:nth-child(2n) { background: #ff6b6b; }
        .confetti:nth-child(3n) { background: #4ecdc4; }
        .confetti:nth-child(4n) { background: #95e1d3; }
        .confetti:nth-child(5n) { background: #ffe66d; }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .birthday-title {
                font-size: 3.5rem;
            }

            .birthday-emoji {
                font-size: 4.5rem;
            }

            .tap-hint {
                font-size: 1.1rem;
                padding: 15px 28px;
            }

            .message-container {
                padding: 40px 25px;
            }

            .message-container h1 {
                font-size: 2.5rem;
            }

            .message-line {
                font-size: 1.3rem;
                line-height: 2;
            }

            .message-line.highlight {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .birthday-title {
                font-size: 2.5rem;
            }

            .birthday-emoji {
                font-size: 3.5rem;
            }

            .tap-hint {
                font-size: 0.95rem;
                padding: 12px 22px;
                bottom: 30px;
            }

            .message-container {
                padding: 30px 20px;
            }

            .message-container h1 {
                font-size: 2rem;
            }

            .message-line {
                font-size: 1.1rem;
                line-height: 1.8;
            }

            .message-line.highlight {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Page 1: Image with tap to continue -->
    <div class="page active" id="page1">
        <div class="page1-content">
            <span class="birthday-emoji">🎂</span>
            <h1 class="birthday-title">Happy Birthday!</h1>
        </div>
        <div class="tap-hint">Tap to read your special message</div>
    </div>

    <!-- Page 2: Message with image2 background -->
    <div class="page" id="page2">
        <div class="message-section">
            <div class="message-container">
                <h1>Happy Birthday! 🎉</h1>
                <div class="message-content">
                    <div class="message-line">On this special day,</div>
                    <div class="message-line highlight">I want you to know</div>
                    <div class="message-line">how much you mean to me.</div>
                    <div class="message-line">Every moment with you</div>
                    <div class="message-line highlight">is a treasure,</div>
                    <div class="message-line">and every memory we've made</div>
                    <div class="message-line">brings a smile to my face.</div>
                    <div class="message-line highlight">May your day be filled</div>
                    <div class="message-line">with endless joy,</div>
                    <div class="message-line">laughter, and love!</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Confetti animation
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animation = `confettiFall ${Math.random() * 2 + 2}s linear infinite`;
                document.body.appendChild(confetti);
            }
        }

        // Page transition
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');

        // Tap on page 1 to reveal page 2
        page1.addEventListener('click', () => {
            page1.classList.remove('active');
            page2.classList.add('active');
            createConfetti();
            animateMessageLines();
        });

        // Animate message lines
        function animateMessageLines() {
            const messageLines = document.querySelectorAll('.message-line');
            messageLines.forEach((line, index) => {
                line.style.animationDelay = `${index * 0.2}s`;
            });
        }
    </script>
</body>
</html>
